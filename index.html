function delMant(id){if(!confirm('¿Borrar?'))return;REAL.mant[id]={...REAL.mant[id],del:true,ua:now()};saveReal();renderAll();}
function modInc2(){
 const c=calc();
 openMod(`<h2>⚠️ Incidente</h2>
  <div><label>Qué pasó</label><input id="xW" autofocus></div>
  <div class="row mt"><div><label>Fecha</label><input id="xD" type="date" value="${today()}"></div>
   <div><label>Odómetro</label><input id="xO" type="number" value="${c.odoNow||''}"></div>
   <div><label>Costo USD</label><input id="xC" type="number" step="0.01"></div></div>
  <div class="mt"><label>Detalle</label><textarea id="xN" rows="3"></textarea></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  <button class="btn p" style="flex:1" onclick="saveInc2()">Guardar</button></div>`);}
function saveInc2(){const w=$('#xW').value.trim();if(!w)return;const id=uid();
 REAL.inc2[id]={id,what:w,date:$('#xD').value||today(),odo:+$('#xO').value||0,cost:+$('#xC').value||0,
  note:$('#xN').value,solved:false,ua:now()};saveReal();closeMod();renderAll();}
function togInc2(id){const i=REAL.inc2[id];if(i){i.solved=!i.solved;i.ua=now();saveReal();renderAll();}}
function delInc2(id){if(!confirm('¿Borrar?'))return;REAL.inc2[id]={...REAL.inc2[id],del:true,ua:now()};saveReal();renderAll();}

/* --------------------------------------------------------------------------
   GUITARRA
   -------------------------------------------------------------------------- */
let recorder=null,recChunks=[],recSong=null;
function renderGuitarra(){
 const c=calc(),ss=Object.values(REAL.songs).filter(s=>!s.del).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const listas=ss.filter(s=>s.st==='lista');
 const paises=[...new Set(ss.map(s=>s.pais).filter(Boolean))];
 let h='';
 h+=`<div class="kpis" style="margin-bottom:14px">
  <div class="kpi pu"><div class="l">Canciones aprendidas</div><div class="v">${listas.length}</div>
   <div class="d">${ss.length-listas.length} en proceso</div></div>
  <div class="kpi pu"><div class="l">Países con canción</div><div class="v">${paises.length}</div>
   <div class="d">${esc(paises.slice(0,3).join(' · '))}</div></div>
  <div class="kpi pu"><div class="l">Grabaciones</div><div class="v">${ss.filter(s=>s.audio||s.video).length}</div>
   <div class="d">audio propio o link de video</div></div>
  <div class="kpi pu"><div class="l">Ritmo</div><div class="v">${c.dayN?n1(listas.length/(c.dayN/30)):0}<small>/mes</small></div>
   <div class="d">canciones terminadas por mes</div></div></div>`;

 h+=`<div class="btnrow" style="margin-bottom:12px"><button class="btn b" onclick="modSong()">＋ Nueva canción</button></div>`;
 if(!ss.length)h+=`<div class="card"><div class="muted">Todavía no hay canciones. Cada una guarda dónde y cuándo la aprendiste — al final del viaje es un mapa musical de la ruta.</div></div>`;

 h+=`<div class="grid">`;
 ss.forEach(s=>{
  const busca=encodeURIComponent(s.n+' '+(s.artista||'')+' acordes');
  h+=`<div class="card" style="margin:0"><div style="display:flex;gap:8px;align-items:baseline">
   <div style="flex:1"><b style="font-size:15.5px">${esc(s.n)}</b>
   <div class="muted">${esc(s.artista||'')}</div></div>
   <span class="tag ${s.st==='lista'?'ok':s.st==='aprendiendo'?'warn':''}">${esc(s.st)}</span></div>
   <div class="muted" style="margin-top:6px">${s.date?fDate(s.date):''}${s.pais?' · '+esc(s.pais):''}${s.lugar?' · '+esc(s.lugar):''}</div>
   ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
   <div class="btnrow mt">
    ${s.acordes?`<a class="btn sm" target="_blank" href="${esc(s.acordes)}">🎼 Acordes</a>`
     :`<a class="btn sm" target="_blank" href="https://www.lacuerda.net/buscar/?q=${busca}">🔎 Buscar acordes</a>`}
    ${s.video?`<a class="btn sm" target="_blank" href="${esc(s.video)}">▶️ Video</a>`:''}
    <button class="btn sm" onclick="recToggle('${s.id}')" id="rec-${s.id}">${recSong===s.id?'⏹ Parar':'🎙️ Grabar'}</button>
    ${s.audio?`<button class="btn sm" onclick="playSong('${s.id}')">🔊 Escuchar</button>`:''}
    <button class="btn sm" onclick="modSong('${s.id}')">✏️</button></div>
   <audio id="au-${s.id}" style="display:none;width:100%;margin-top:8px" controls></audio></div>`;});
 h+=`</div>`;
 h+=`<div class="hint" style="padding:8px 4px">El botón de grabar usa el micrófono del teléfono y guarda el audio en este dispositivo (no se sube a ningún lado). Para un video que quieras mostrar, subilo a YouTube o Instagram y pegá el link en la canción — así lo podés compartir y no ocupa lugar.</div>`;
 $('#v-guitarra').innerHTML=h;}
function modSong(id){
 const s=id?REAL.songs[id]:{};
 openMod(`<h2>${id?'Editar':'Nueva'} canción</h2>
  <div class="row"><div><label>Canción</label><input id="sN" value="${esc(s.n||'')}" autofocus></div>
   <div><label>Artista</label><input id="sA" value="${esc(s.artista||'')}"></div></div>
  <div class="row mt"><div><label>Estado</label><select id="sS">
   ${['quiero aprender','aprendiendo','lista'].map(x=>`<option ${s.st===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div><label>Fecha</label><input id="sD" type="date" value="${s.date||today()}"></div></div>
  <div class="row mt"><div><label>País</label><input id="sP" value="${esc(s.pais||(planStopFor(today())||{}).country||'')}"></div>
   <div><label>Dónde</label><input id="sL" value="${esc(s.lugar||'')}" placeholder="camping, fogón, playa"></div></div>
  <div class="mt"><label>Link a los acordes</label><input id="sC" value="${esc(s.acordes||'')}" placeholder="lacuerda.net / ultimate-guitar"></div>
  <div class="mt"><label>Link a un video tuyo tocándola</label><input id="sV" value="${esc(s.video||'')}" placeholder="YouTube, Instagram, Drive"></div>
  <div class="mt"><label>Nota</label><input id="sT" value="${esc(s.note||'')}" placeholder="capo 2, la aprendí con el chileno de Uyuni…"></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  ${id?`<button class="btn" onclick="delSong('${id}')">Borrar</button>`:''}
  <button class="btn p" style="flex:1" onclick="saveSong(${id?"'"+id+"'":'null'})">Guardar</button></div>`);}
function saveSong(id){
 const n=$('#sN').value.trim();if(!n)return;
 const k=id||uid(),prev=REAL.songs[k]||{};
 REAL.songs[k]={...prev,id:k,n,artista:$('#sA').value,st:$('#sS').value,date:$('#sD').value,
  pais:$('#sP').value,lugar:$('#sL').value,acordes:$('#sC').value,video:$('#sV').value,note:$('#sT').value,ua:now()};
 saveReal();closeMod();renderAll();}
function delSong(id){if(!confirm('¿Borrar la canción?'))return;
 REAL.songs[id]={...REAL.songs[id],del:true,ua:now()};saveReal();closeMod();renderAll();}
async function recToggle(id){
 if(recSong===id&&recorder){recorder.stop();return;}
 if(!navigator.mediaDevices){alert('Este navegador no permite grabar audio.');return;}
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  recChunks=[];recorder=new MediaRecorder(st);recSong=id;
  recorder.ondataavailable=e=>recChunks.push(e.data);
  recorder.onstop=async()=>{
   st.getTracks().forEach(t=>t.stop());
   const b=new Blob(recChunks,{type:recorder.mimeType||'audio/webm'});
   const fr=new FileReader();
   fr.onload=async()=>{const k='song_'+id;await blobSave(k,fr.result);
    REAL.songs[id]={...REAL.songs[id],audio:k,ua:now()};saveReal();recorder=null;recSong=null;renderAll();};
   fr.readAsDataURL(b);};
  recorder.start();renderGuitarra();
 }catch(e){alert('No se pudo acceder al micrófono.');recSong=null;}}
async function playSong(id){
 const u=await blobGet('song_'+id);if(!u)return;
 const a=$('#au-'+id);a.src=u;a.style.display='block';a.play();}

/* --------------------------------------------------------------------------
   AJUSTES
   -------------------------------------------------------------------------- */
function renderAjustes(){
 const c=calc();
 let h=`<div class="grid">
  <div class="card"><h3>🚙 Odómetro inicial</h3>
   <label>Millas en el tablero el día de la salida</label>
   <input type="number" inputmode="numeric" value="${REAL.cfg.odo0||''}" onchange="REAL.cfg.odo0=parseFloat(this.value)||null;saveReal();renderAll()">
   <div class="note">Sin esto no hay km reales, ni MPG, ni vencimientos de service. Cargalo antes de arrancar.</div></div>
  <div class="card"><h3>💾 Respaldo</h3>
   <div class="btnrow"><button class="btn b" onclick="exportJson()">Exportar todo</button>
   <button class="btn" onclick="document.getElementById('imp').click()">Importar</button></div>
   <input type="file" id="imp" accept=".json" style="display:none" onchange="importJson(this)">
   <div class="hint">Las fotos y las grabaciones viven solo en este dispositivo. El resto se sincroniza con el otro teléfono. Exportá cada tanto y guardalo en Drive.</div></div></div>`;
 h+=`<div class="card"><h3>💱 Monedas <span class="r">1 USD = ?</span></h3><table>
  ${Object.keys(FX_SEED).filter(k=>k!=='USD').map(k=>{const f=REAL.fx[k]||{};
   return `<tr><td style="width:60px"><b>${k}</b></td>
   <td><input type="number" step="0.0001" value="${f.r||FX_SEED[k]}" onchange="setFx('${k}',this.value)"></td>
   <td style="width:96px" class="n"><span class="tag ${f.ok?'ok':'warn'}">${f.ok?'confirmado':'estimado'}</span></td></tr>`;}).join('')}</table>
  <div class="note">Los estimados son de agosto 2026 y pueden estar muy lejos, sobre todo el peso argentino. Confirmá cada moneda la primera vez que cruzás. Cada gasto guarda el TC del momento, así que corregir esto no cambia lo ya cargado.</div></div>`;
 h+=`<div class="card"><h3>ℹ️ Estado</h3><table>
  <tr><td>Plan cargado</td><td class="n">${planStops().length} paradas</td></tr>
  <tr><td>Días registrados</td><td class="n">${lDays().length}</td></tr>
  <tr><td>Movimientos</td><td class="n">${c.exps.length+c.fuels.length+c.incs.length}</td></tr>
  <tr><td>Sincronización</td><td class="n">${SYNC==='on'?'activa':'local'}</td></tr></table>
  <div class="hint">El plan es de solo lectura: esta app nunca lo modifica. Para cambiar la ruta o el presupuesto, usá la app de planificación.</div></div>`;
 $('#v-ajustes').innerHTML=h;}
function setFx(k,v){REAL.fx[k]={r:parseFloat(v)||FX_SEED[k],ok:true,ua:now()};saveReal();renderAll();}
function exportJson(){
 const b=new Blob([JSON.stringify({real:REAL,plan:PLAN,exported:new Date().toISOString()},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vida-ruta-'+today()+'.json';a.click();}
function importJson(i){const f=i.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.real){REAL=mergeReal(REAL,d.real);saveReal();renderAll();alert('Importado.');}}catch(e){alert('Archivo inválido.');}};
 fr.readAsText(f);}

/* --------------------------------------------------------------------------
   RENDER + NAV
   -------------------------------------------------------------------------- */
const R={tablero:renderTablero,hoy:renderHoy,ruta:renderRuta,gastos:renderGastos,ingresos:renderIngresos,
 tramites:renderTramites,cocina:renderCocina,rutinas:renderRutinas,
 camioneta:renderCamioneta,guitarra:renderGuitarra,ajustes:renderAjustes};
function renderHeader(){
 const c=calc();
 if(!c.B.start){$('#hdDay').textContent='—';$('#hdSub').textContent='esperando el plan';return;}
 $('#hdDay').textContent=c.started?`Día ${c.dayN} / ${c.B.days}`:`Faltan ${dDiff(c.t,c.B.start)} días`;
 const st=c.curStop||c.planHoy;
 $('#hdSub').textContent=st?st.country:'';}
function renderAll(){renderHeader();(R[VIEW]||(()=>{}))();}
$('#tabs').innerHTML=TABS.map(([k,e,t])=>`<button data-v="${k}" class="${k==='tablero'?'on':''}">${e}${t?' '+t:''}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>{
 b.onclick=()=>{VIEW=b.dataset.v;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+VIEW));
  window.scrollTo(0,0);renderAll();};});

/* --------------------------------------------------------------------------
   ARRANQUE
   -------------------------------------------------------------------------- */
(function boot(){
 PLAN=lsGet(LS_PLAN,PLAN);
 REAL=Object.assign(JSON.parse(JSON.stringify(REAL_EMPTY)),lsGet(LS_REAL,{}));
 KEYS.forEach(k=>{if(!REAL[k])REAL[k]={};});
 if(!REAL.cfg)REAL.cfg={odo0:null,ua:0};
 try{YO=localStorage.getItem('vr_yo')||null;}catch(e){}
 if(YO&&!PERSONAS[YO])YO=null;
 // Reset duro. Al subir este token se borra todo lo cargado (también en
 // Firestore, porque el doc vacío se sincroniza) y se vuelve a sembrar.
 const RESET='r3-2026-08';
 let seBorro=false;
 if(REAL.cfg.reset!==RESET){
  KEYS.forEach(k=>{REAL[k]={};});
  const odo=REAL.cfg.odo0;
  REAL.cfg={odo0:odo,reset:RESET,resetAt:now(),ua:now()};
  try{indexedDB.deleteDatabase('vidaruta');}catch(e){}
  seBorro=true;
 }
 // Semillas: solo se cargan la primera vez. Si borrás algo, no vuelve.
 if(!REAL.cfg.seed1){
  IDEAS_SEED.forEach(i=>{if(!REAL.ideas[i.id])REAL.ideas[i.id]={...i,ua:now()};});
  REAL.cfg.seed1=true;
 }
 // seed2: hábitos, tareas y checklist de Samy del panel Ruta Sur. Va aparte de
 // seed1 para que quien ya tenía la versión anterior de la app los reciba igual.
 if(!REAL.cfg.seed2){
  Object.keys(REAL.habitos).forEach(k=>{if(!REAL.habitos[k]||!REAL.habitos[k].q)delete REAL.habitos[k];});
  HABITOS_SEED.forEach(x=>{if(!REAL.habitos[x.id])REAL.habitos[x.id]={...x,ua:now()};});
  TAREAS_SEED.forEach(x=>{if(!REAL.tareas[x.id])REAL.tareas[x.id]={...x,ua:now()};});
  SAMY_SEED.forEach((t,i)=>{const id='sy'+i;if(!REAL.samy[id])REAL.samy[id]={id,t,ok:false,ua:now()};});
  REAL.hlog={};   // el formato viejo era por fecha; el nuevo es por fecha|persona
  REAL.cfg.seed2=true;
 }
 setSync('off','local');
 renderAll();
 lsSet(LS_REAL,REAL);
 initFirebase();
 // Si acabamos de borrar, empujamos el documento vacío para que el reset
 // llegue también al otro teléfono en vez de quedar solo en este.
 if(seBorro)setTimeout(()=>{saveReal();},2500);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
