<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e2a32">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Vida de Ruta — La Samineta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f4f2; --card:#fff; --line:#e2e8f0; --line2:#f0f0f0;
  --tx:#1e293b; --tx2:#64748b; --tx3:#94a3b8;
  --nav:#1e2a32; --nav2:#37474f; --amber:#f9a825;
  --blue:#1565c0; --green:#2e7d32; --purple:#7b1fa2; --red:#c62828; --orange:#e65100; --teal:#00838f;
  --ok:#2e7d32; --warn:#e65100; --bad:#c62828;
  --sh:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:16px}
input,select,textarea{background:#fff;color:var(--tx);border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
label{display:block;font-size:11.5px;color:var(--tx2);margin:0 0 4px 2px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
a{color:var(--blue)}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:60;background:var(--nav);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 0 0}
.hrow{display:flex;align-items:center;gap:10px;padding:0 14px 8px}
.hrow h1{font-size:15px;white-space:nowrap}
.hrow .meta{font-size:11.5px;color:#b0bec5;margin-left:auto;text-align:right;line-height:1.3}
.hrow .meta b{color:#fff;font-size:13px;display:block}
.sync{font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;border:1px solid #546e7a;color:#b0bec5;white-space:nowrap}
.sync.on{color:#a5d6a7;border-color:#4caf50}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--nav2);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--amber);color:var(--nav);font-weight:800}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:16px 12px 60px}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card>h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3 .r{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:600}
.sec-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx2);font-weight:800;margin:20px 0 9px 3px}
.muted{color:var(--tx2);font-size:13px}
.hint{color:var(--tx2);font-size:12px;line-height:1.5;margin-top:8px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.mt{margin-top:10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

/* ---------- KPI ---------- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.kpi.ok{border-top-color:var(--ok)} .kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--bad)}
.kpi.pu{border-top-color:var(--purple)} .kpi.te{border-top-color:var(--teal)}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);font-weight:800}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:5px 0 3px;color:var(--blue)}
.kpi .v small{font-size:14px;font-weight:700;color:var(--tx2)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi.pu .v{color:var(--purple)} .kpi.te .v{color:var(--teal)}
.kpi .d{font-size:12px;color:var(--tx2);line-height:1.4}
.kpi.wide{grid-column:1/-1}
.hero{background:linear-gradient(135deg,#1565c0,#1e3a5f);color:#fff;border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700;margin-top:2px}
.bar{height:9px;background:#eceff1;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}

/* ---------- LISTAS ---------- */
.li{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:none}
.li .ic{width:34px;height:34px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:14px;font-weight:700}
.li .m span{font-size:11.5px;color:var(--tx2)}
.li .a{text-align:right;font-weight:800;font-size:14.5px;white-space:nowrap}
.li .a span{display:block;font-size:11px;color:var(--tx3);font-weight:600}
.x{background:none;border:none;color:var(--tx3);font-size:16px;cursor:pointer;padding:4px;width:auto}

/* ---------- BOTONES ---------- */
.btn{background:#f1f5f9;color:var(--tx);border:1px solid #cbd5e1;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.b{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.w{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:640px){.chips{grid-template-columns:repeat(8,1fr)}}
.chip{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 3px;cursor:pointer;text-align:center;box-shadow:var(--sh)}
.chip:active{background:#fff8e1;border-color:var(--amber)}
.chip .e{font-size:21px;display:block;line-height:1.15}
.chip .t{font-size:10px;font-weight:700;color:var(--tx2);margin-top:2px}
.seg{display:flex;background:#eceff1;border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:none;border:none;color:var(--tx2);padding:8px 5px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:var(--tx);box-shadow:var(--sh)}

/* ---------- TABLA ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);padding:7px 6px;border-bottom:2px solid var(--line);font-weight:800}
td{padding:9px 6px;border-bottom:1px solid var(--line2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--bad)}.neg{color:var(--ok)}

/* ---------- MISC ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:#eceff1;color:var(--tx2)}
.tag.ok{background:#e8f5e9;color:var(--ok)}.tag.warn{background:#fff3e0;color:var(--warn)}.tag.bad{background:#ffebee;color:var(--bad)}
.tag.b{background:#e3f2fd;color:var(--blue)}.tag.pu{background:#f3e5f5;color:var(--purple)}
.note{font-size:12.5px;color:#555;background:#fffde7;border-left:3px solid var(--amber);padding:7px 11px;margin-top:9px;border-radius:0 7px 7px 0}
.banner{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;border-left:4px solid}
.banner.r{background:#ffebee;border-color:var(--bad);color:#7f1d1d}
.banner.w{background:#fff8e1;border-color:var(--amber);color:#78350f}
.banner.i{background:#e3f2fd;border-color:var(--blue);color:#0d47a1}
.banner.g{background:#e8f5e9;border-color:var(--ok);color:#14532d}
#map{height:420px;border-radius:12px;border:1px solid var(--line)}
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.ph .add{aspect-ratio:1;border:2px dashed #cbd5e1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--tx3);cursor:pointer;background:#fff}
.mod{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px}
.mod.on{display:flex}
.mod .in{background:#fff;border-radius:14px;padding:20px;width:min(520px,96vw);max-height:92vh;overflow:auto}
.mod h2{font-size:17px;margin-bottom:14px}
/* grilla mensual de hábitos (portada del panel Ruta Sur) */
.grilla{display:grid;grid-template-columns:150px repeat(var(--cols),16px);gap:2px;min-width:min-content}
.g-esq{position:sticky;left:0;background:#fff;z-index:2}
.g-dia{font-size:9px;color:var(--tx3);text-align:center;font-weight:800;padding-bottom:2px}
.g-dia.hoy{color:var(--blue)}
.g-nom{position:sticky;left:0;background:#fff;z-index:2;font-size:11.5px;display:flex;align-items:center;
 gap:4px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.celda{height:16px;border-radius:3px;background:#eceff1;border:1px solid var(--line);cursor:pointer}
.celda.on{background:var(--ok);border-color:var(--ok)}
.celda.futuro{opacity:.35;cursor:default}
@media(max-width:520px){.grilla{grid-template-columns:112px repeat(var(--cols),15px)}}
.wk .c.on{background:var(--ok)}
.wk .c.fu{background:#fafafa;cursor:default}
.score{display:flex;gap:3px}
.score i{width:7px;height:7px;border-radius:50%;background:#dde3ea}
.score i.f{background:var(--blue)}
</style>
</head>

/* HITO vs PARTIDA
   El presupuesto del plan mezcla dos cosas distintas bajo el mismo nombre de
   "costos únicos":
     · HITO    — pasa una vez, en una fecha: el barco del Darién, el ferry,
                 la entrada a Tikal. Se marca cuando se paga y listo.
     · PARTIDA — es una bolsa de plata para algo que va a pasar muchas veces:
                 peajes, mantenimiento, tasas de frontera. No se "completa":
                 se va consumiendo gasto por gasto.
   Tratar una partida como hito obliga a cargar todos los peajes de México en

// Contra qué categoría de gasto se descuenta cada partida.
const PARTIDA_GASTO={mantenimiento:["auto"],peajes:["peajes"],tramites:["tramites"],
 entretenimiento:["entretenimiento"],pasajes:["otros"]};
function esPartida(o){
 const r=(REAL.envel||{})[o.name];
 return (r&&typeof r.v==='boolean')?r.v:PARTIDA_CATS.includes(o.cat||'');}

 {id:"villazon",t:"Entrada del auto a Argentina (Villazón)",m:/villaz[oó]n/i,note:"Ver la ficha completa en Trámites. Necesita certificado consular de residencia en el exterior tramitado ANTES de salir."}
];

 {id:"i2",t:"Artesanías de Lula vendidas online (Etsy/Instagram) y enviadas",cat:"online",pot:3,esf:3,riesgo:1,cap:1,st:"idea",

 {id:"i3",t:"Artesanías en ferias y mercados de ruta",cat:"presencial",pot:2,esf:3,riesgo:4,cap:1,st:"idea",
  note:"Es lo más lindo y lo más riesgoso: vender con visa de turista es trabajo informal. En México y Centroamérica una multa migratoria puede complicar el TIP del auto. Si se hace, que sea en ferias hippies/de artesanos donde es práctica tolerada, y sin puesto fijo."},
 {id:"i4",t:"Contenido: Instagram/YouTube de La Samineta",cat:"contenido",pot:3,esf:4,riesgo:1,cap:0,st:"idea",

const $=s=>document.querySelector(s);

const q=s=>JSON.stringify(String(s)).replace(/"/g,'&quot;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>iso(new Date());
const D=s=>new Date(s+'T00:00:00');
const dDiff=(a,b)=>Math.round((D(b)-D(a))/86400000);
const MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DOW=["do","lu","ma","mi","ju","vi","sá"];
const fDate=s=>{if(!s)return"—";const d=D(s);return d.getDate()+' '+MONTHS[d.getMonth()];};
const n0=v=>Math.round(v||0).toLocaleString('es-AR');
const n1=v=>(v||0).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const usd=v=>'$'+n0(v);
const sgn=v=>(v>=0?'+':'−')+n0(Math.abs(v));
function haversineKm(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
 const t=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
 return R*2*Math.atan2(Math.sqrt(t),Math.sqrt(1-t));}
function inferCountry(stop,prev){
 const m=String(stop.note||"").match(/ya en ([a-záéíóúñ]+(?:\s+[a-záéíóúñ]+)?)/i);
 if(m){const c=COUNTRY_PATTERNS.find(p=>p.country.toLowerCase()===m[1].trim().toLowerCase());if(c)return c.country;}
 const cl=String(stop.n||"").replace(/\b(cruce|paso|entrada)\s+a\s+\S+/gi,"");
 for(const p of COUNTRY_PATTERNS){if(p.re.test(cl))return p.country;}
 return prev||"Estados Unidos";}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('LS lleno',e);}}
function saveReal(push=true){REAL.cfg.ua=now();lsSet(LS_REAL,REAL);if(push)pushReal();}
const KEYS=["days","exp","fuel","inc","ideas","tram","gates","oneoff","fx","habitos","tareas","hlog","tlog","samy","mant","inc2","songs","chk","envel"];
function mergeReal(local,remote){
 if(!remote)return local;
 const out=JSON.parse(JSON.stringify(local));
 // Corte por reset: si se borró todo, hay que ignorar los registros remotos
 // anteriores al borrado. Si no, el primer onSnapshot los devuelve a la vida
 // (el merge los ve como "nuevos" porque localmente ya no existen).
 const cut=out.cfg&&out.cfg.resetAt||0;
 KEYS.forEach(k=>{const r=remote[k]||{};out[k]=out[k]||{};
  Object.keys(r).forEach(id=>{const a=out[k][id],b=r[id];
   if(!b||(b.ua||0)<cut)return;
   if(!a||(b.ua||0)>(a.ua||0))out[k][id]=b;});});
 if(remote.cfg&&(remote.cfg.ua||0)>(out.cfg.ua||0)&&(remote.cfg.resetAt||0)>=cut)out.cfg=remote.cfg;
 return out;}
function setSync(s,t){SYNC=s;const e=$('#sync');e.className='sync '+(s==='on'?'on':'');e.textContent=t||(s==='on'?'sinc':'local');}
let pt=null;
function pushReal(){
 if(!FB_DB){setSync('off','local');return;}
 clearTimeout(pt);
 pt=setTimeout(()=>{FB_DB.collection(COL).doc(DOC_REAL).set(REAL,{merge:false})
  .then(()=>setSync('on')).catch(()=>setSync('off','pendiente'));},900);}
function initFirebase(){
 if(window.__noFb||typeof firebase==='undefined'){setSync('off','sin red');return;}
 try{
  firebase.initializeApp(FB);FB_DB=firebase.firestore();
  FB_DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  FB_DB.collection(COL).doc(DOC_PLAN).get().then(d=>{
   if(d.exists){const p=d.data();PLAN={stops:p.stops||[],items:p.items||[],budget:p.budget||null,loaded:true};lsSet(LS_PLAN,PLAN);renderAll();}}).catch(()=>{});
  FB_DB.collection(COL).doc(DOC_REAL).onSnapshot(d=>{
   setSync('on');if(!d.exists)return;
   const m=mergeReal(REAL,d.data());
   if(JSON.stringify(m)!==JSON.stringify(REAL)){REAL=m;lsSet(LS_REAL,REAL);renderAll();}},
   ()=>setSync('off','pendiente'));
 }catch(e){setSync('off','error');}}

/* ---- Fotos y audio en IndexedDB (no van a Firestore: tope de 1 MB) ---- */
let IDB=null;
function idb(){return new Promise(r=>{if(IDB)return r(IDB);
 const q=indexedDB.open('vidaruta',1);
 q.onupgradeneeded=e=>{e.target.result.createObjectStore('fotos');};
 q.onsuccess=e=>{IDB=e.target.result;r(IDB);};q.onerror=()=>r(null);});}
async function blobSave(k,v){const db=await idb();if(db)db.transaction('fotos','readwrite').objectStore('fotos').put(v,k);}
async function blobGet(k){const db=await idb();if(!db)return null;
 return new Promise(r=>{const g=db.transaction('fotos').objectStore('fotos').get(k);g.onsuccess=()=>r(g.result||null);g.onerror=()=>r(null);});}
async function blobDel(k){const db=await idb();if(db)db.transaction('fotos','readwrite').objectStore('fotos').delete(k);}
function resize(f){return new Promise(res=>{const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1400,s=Math.min(1,M/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*s|0;c.height=im.height*s|0;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));};im.src=fr.result;};
 fr.readAsDataURL(f);});}

/* --------------------------------------------------------------------------
   MODELO DERIVADO
   -------------------------------------------------------------------------- */
function planStops(){return (PLAN.stops||[]).filter(s=>s.start&&s.end);}
function planEnriched(){
 const st=planStops(),out=[];let prev="Estados Unidos",acc=0;
 st.forEach((s,i)=>{const c=inferCountry(s,prev);prev=c;
  const km=i>0?haversineKm(st[i-1].lat,st[i-1].lon,s.lat,s.lon)*ROAD_FACTOR:0;acc+=km;
  out.push({...s,i,country:c,region:REGION_BY_COUNTRY[c]||"Sudamérica",legKm:km,accKm:acc});});
 return out;}
function tripBounds(){const st=planStops();if(!st.length)return{start:null,end:null,days:0};
 return{start:st[0].start,end:st[st.length-1].end,days:dDiff(st[0].start,st[st.length-1].end)+1};}
function planStopFor(d){const P=planEnriched();if(!P.length)return null;let c=P[0];
 for(const s of P){if(dDiff(s.start,d)>=0)c=s;else break;}return c;}
function fxRate(c){if(c==='USD')return 1;const f=REAL.fx[c];return(f&&f.r>0)?f.r:(FX_SEED[c]||1);}
function fxOk(c){return c==='USD'||(REAL.fx[c]&&REAL.fx[c].ok);}
const lExp=()=>Object.values(REAL.exp).filter(x=>x&&!x.del);
const lFuel=()=>Object.values(REAL.fuel).filter(x=>x&&!x.del);
const lInc=()=>Object.values(REAL.inc).filter(x=>x&&!x.del);
const lDays=()=>Object.values(REAL.days).filter(x=>x&&!x.del).sort((a,b)=>a.date.localeCompare(b.date));

function calc(){
 const B=tripBounds(),t=today(),bud=PLAN.budget||{};
 const perDay=bud.perDayUsd||{comida:{},alojamiento:{},otros:0};
 const fuelP=bud.fuel||{kmPerLiter:18,pricePerLiter:{}};
 const oneOff=bud.oneOff||[],contPct=bud.contingencyPct||20;
 const started=B.start?dDiff(B.start,t)>=0:false;
 const dayN=B.start?Math.max(0,Math.min(B.days,dDiff(B.start,t)+1)):0;
 const daysLeft=B.end?Math.max(0,dDiff(t,B.end)):0;
 const elapsed=Math.max(1,dayN);
 const P=planEnriched();

 let planCorr=0,planKm=0;
 const byReg={};REGION_ORDER.forEach(r=>byReg[r]={dias:0,plan:0,real:0});
 if(B.start){
  for(let k=0;k<dayN;k++){const d=iso(D(B.start).getTime()+k*86400000);const s=planStopFor(d);if(!s)continue;
   const v=(perDay.comida[s.region]||0)+(perDay.alojamiento[s.region]||0)+(perDay.otros||0);
   planCorr+=v;byReg[s.region].dias++;byReg[s.region].plan+=v;}
  const sh=planStopFor(t);planKm=sh?sh.accKm:0;
  P.filter(s=>s.i<=(sh?sh.i:0)).forEach(s=>{const pr=(fuelP.pricePerLiter||{})[s.region]||1.2;
   const c=(s.legKm/100)*(fuelP.kmPerLiter||18)*pr;planCorr+=c;if(byReg[s.region])byReg[s.region].plan+=c;});}

 const exps=lExp(),fuels=lFuel(),incs=lInc();
 let realCorr=0,realTotal=0;const byCat={};Object.keys(CATS).forEach(c=>byCat[c]=0);
 exps.forEach(e=>{const u=e.usd||0;realTotal+=u;byCat[e.cat]=(byCat[e.cat]||0)+u;
  // Un gasto ligado a un costo único NUNCA entra en el corriente, aunque su
  // categoría sea "otros": el ferry no es un gasto del día a día y mezclarlo
  // rompe el $/día, que es el único número sobre el que se puede actuar.
  if(CORRIENTE.includes(e.cat)&&!e.oneOff)realCorr+=u;
  const r=REGION_BY_COUNTRY[e.country];if(r&&byReg[r])byReg[r].real+=u;});
 fuels.forEach(f=>{const u=f.usd||0;realTotal+=u;realCorr+=u;byCat.nafta+=u;
  const r=REGION_BY_COUNTRY[f.country];if(r&&byReg[r])byReg[r].real+=u;});
 const income=incs.reduce((a,x)=>a+(x.usd||0),0);

 let planDaily=0,planFuel=0;
 P.forEach(s=>{const pr=(fuelP.pricePerLiter||{})[s.region]||1.2;planFuel+=(s.legKm/100)*(fuelP.kmPerLiter||18)*pr;});
 if(B.start)for(let k=0;k<B.days;k++){const d=iso(D(B.start).getTime()+k*86400000);const s=planStopFor(d);if(!s)continue;
  planDaily+=(perDay.comida[s.region]||0)+(perDay.alojamiento[s.region]||0)+(perDay.otros||0);}
 const planOneOff=oneOff.reduce((a,o)=>a+(o.amount||0),0);
 const planSub=planDaily+planFuel+planOneOff,planCont=planSub*contPct/100,planTotal=planSub+planCont;

 // --- Hitos: lo pagado sale de los gastos ligados al ítem. Un solo origen. ---
 const uniReal={};
 exps.forEach(e=>{if(e.oneOff)uniReal[e.oneOff]=(uniReal[e.oneOff]||0)+(e.usd||0);});
 const hitos=oneOff.filter(o=>!esPartida(o));
 let uniPag=0,uniPend=0,uniEst=0;
 hitos.forEach(o=>{
  if(uniReal[o.name]!=null){uniPag+=uniReal[o.name];uniEst+=(o.amount||0);}
  else uniPend+=(o.amount||0);});

 // --- Partidas: bolsas que se consumen con gastos sueltos, no con un tilde. ---
 const partidas={};
 oneOff.filter(esPartida).forEach(o=>{
  const k=o.cat||'otros';
  if(!partidas[k])partidas[k]={cat:k,plan:0,real:0,items:[],movs:0};
  partidas[k].plan+=(o.amount||0);partidas[k].items.push(o);});
 Object.keys(partidas).forEach(k=>{
  const cats=PARTIDA_GASTO[k]||[];
  // Solo cuentan los gastos NO ligados a un hito: si un gasto ya se imputó a
  // un ítem puntual, contarlo también acá sería contarlo dos veces.
  exps.filter(e=>!e.oneOff&&cats.includes(e.cat)).forEach(e=>{
   partidas[k].real+=(e.usd||0);partidas[k].movs++;});
  // Lo que falta gastar de la bolsa también es plata comprometida.
  uniPend+=Math.max(0,partidas[k].plan-partidas[k].real);
  uniPag+=partidas[k].real;});

 const burn=realCorr/elapsed,burnPlan=planCorr/elapsed;
 const desvio=realCorr-planCorr,desvioPct=planCorr>0?desvio/planCorr*100:0;
 // Los ingresos ya cobrados cuentan como plata disponible. Lo que NO se hace es
 // extrapolar el ritmo de ingresos al resto del viaje: con 3 semanas de datos eso
 // infla el runway y el tablero pasa a mentir para el lado optimista. El escenario
 // "si mantengo este ritmo" se muestra aparte, marcado como escenario.
 const incRate=income/elapsed,netBurn=Math.max(0.01,burn-incRate);
 const disponible=planTotal-realTotal+income,colchon=disponible-uniPend;
 const runway=colchon/Math.max(0.01,burn);              // conservador: solo lo ya cobrado
 const runwayOpt=colchon/netBurn;                        // escenario con ingresos sostenidos
 const runwayRatio=daysLeft>0?runway/daysLeft:9;
 const proyeccion=realTotal+burn*daysLeft+uniPend-income;
 const proyDesvio=proyeccion-planTotal;

 const odo0=REAL.cfg.odo0;
 const odoNow=(()=>{const d=lDays().filter(x=>x.odo);return d.length?d[d.length-1].odo:null;})();
 const millas=(odo0!=null&&odoNow!=null)?Math.max(0,odoNow-odo0):0,kmReal=millas*KM_PER_MI;
 let gal=0;fuels.forEach(f=>{gal+=f.unit==='gal'?(f.qty||0):(f.qty||0)/L_PER_GAL;});
 const mpgReal=gal>0&&millas>0?millas/gal:null,mpgPlan=235.215/(fuelP.kmPerLiter||18);
 const kmPlanTotal=P.reduce((a,s)=>a+s.legKm,0),kmRest=Math.max(0,kmPlanTotal-kmReal);
 const precioProm=REGION_ORDER.reduce((a,r)=>a+((fuelP.pricePerLiter||{})[r]||1.2),0)/4;
 const mpgImpacto=mpgReal?(kmRest/100)*((235.215/mpgReal)-(fuelP.kmPerLiter||18))*precioProm:0;

 const ld=lDays().slice(-1)[0];
 const curStop=ld&&ld.stopIdx!=null?P[ld.stopIdx]:null;
 const planHoy=planStopFor(t);
 const atraso=curStop?dDiff(curStop.start,t):null;
 const gates=GATES.map(g=>{const s=P.find(x=>g.m.test(x.n));
  return{...g,date:s?s.start:null,dias:s?dDiff(t,s.start):null,st:(REAL.gates[g.id]||{}).status||'abierto'};}).filter(g=>g.date);

 return{B,t,started,dayN,daysLeft,elapsed,P,exps,fuels,incs,income,incRate,
  planCorr,realCorr,realTotal,byCat,byReg,planTotal,planSub,planCont,planDaily,planFuel,planOneOff,contPct,
  uniPag,uniPend,uniEst,uniReal,hitos,partidas,oneOff,burn,burnPlan,netBurn,desvio,desvioPct,disponible,colchon,runway,runwayOpt,runwayRatio,proyeccion,proyDesvio,
  odo0,odoNow,millas,kmReal,gal,mpgReal,mpgPlan,mpgImpacto,kmPlanTotal,planKm,curStop,planHoy,atraso,gates};}

function sem(v,ok,warn,inv){return inv?(v<=ok?'ok':v<=warn?'warn':'bad'):(v>=ok?'ok':v>=warn?'warn':'bad');}

function renderTablero(){
 const c=calc();
 if(!planStops().length){$('#v-tablero').innerHTML='<div class="banner i">No se cargó el plan todavía. Conectate a internet una vez y la app se lo guarda para poder usarlo sin señal después.</div>';return;}
 let h='';
 h+=`<div class="hero"><div class="big">${c.started?'Día '+c.dayN+' de '+c.B.days:'Faltan '+dDiff(c.t,c.B.start)+' días'}</div>
  <div class="sub">${c.started?esc((c.curStop||c.planHoy||{}).n||'')+' · '+c.daysLeft+' días para Córdoba':'Salida — '+fDate(c.B.start)}</div></div>`;

 const rg=sem(c.runwayRatio,1.1,1.0);
 h+=`<div class="kpis">
  <div class="kpi ${rg} wide"><div class="l">¿Llego a Córdoba con plata?</div>
   <div class="v">${c.runway>900?'—':n0(c.runway)} <small>días de autonomía · faltan ${n0(c.daysLeft)}</small></div>
   <div class="bar"><i style="width:${Math.min(100,c.runwayRatio*100/1.5)}%;background:var(--${rg==='ok'?'ok':rg==='warn'?'warn':'bad'})"></i></div>
   <div class="d">${rg==='ok'?'Vas bien.':rg==='warn'?'Justo: un imprevisto te come el margen.':'<b>No llegás al ritmo actual.</b> Hay que bajar el gasto diario, sumar ingresos o recortar algo del itinerario.'}
   ${c.income>0?` Cuenta solo los ${usd(c.income)} ya cobrados. Si sostenés el ritmo de ingresos actual, serían <b>${n0(c.runwayOpt)}</b> días — pero eso es un escenario, no un dato.`:''}</div></div>

  <div class="kpi ${sem(c.desvioPct,5,15,true)}"><div class="l">Burn rate real</div>
   <div class="v">$${n0(c.burn)}<small>/día</small></div>
   <div class="d">Plan: $${n0(c.burnPlan)}/día<br>${c.desvio>=0?'De más':'Ahorrado'}: <b>${usd(Math.abs(c.desvio))}</b></div></div>

  <div class="kpi ${c.proyDesvio<=0?'ok':c.proyDesvio<c.planTotal*.1?'warn':'bad'}"><div class="l">Proyección final</div>
   <div class="v">${usd(c.proyeccion)}</div>
   <div class="d">Presupuesto: ${usd(c.planTotal)}<br><b class="${c.proyDesvio>0?'pos':'neg'}">${sgn(c.proyDesvio)} USD</b> vs plan</div></div>

  <div class="kpi ${c.atraso==null?'':sem(Math.abs(c.atraso),2,5,true)}"><div class="l">Cronograma</div>
   <div class="v">${c.atraso==null?'—':(c.atraso===0?'En fecha':(c.atraso>0?'+':'')+c.atraso+'d')}</div>
   <div class="d">${c.curStop?esc(c.curStop.n.slice(0,30)):'Marcá dónde estás en Hoy'}<br>${c.atraso==null?'':c.atraso>0?'Atrasado':c.atraso<0?'Adelantado':'Justo'}</div></div>

  <div class="kpi ${c.mpgReal==null?'':sem(c.mpgReal,c.mpgPlan,c.mpgPlan-1.5)}"><div class="l">Consumo real</div>
   <div class="v">${c.mpgReal?n1(c.mpgReal):'—'}<small> MPG</small></div>
   <div class="d">Plan: ${n1(c.mpgPlan)} MPG${c.mpgReal?`<br><b class="${c.mpgImpacto>0?'pos':'neg'}">${sgn(c.mpgImpacto)} USD</b> de nafta hasta el final`:'<br>Cargá litros + odómetro'}</div></div>

  <div class="kpi te"><div class="l">Ingresos de ruta</div>
   <div class="v">${usd(c.income)}</div>
   <div class="d">$${n0(c.incRate)}/día · cubre el <b>${c.burn?n0(c.incRate/c.burn*100):0}%</b> del gasto diario</div></div>

  <div class="kpi pu"><div class="l">Kilómetros</div>
   <div class="v">${n0(c.kmReal)}<small> km</small></div>
   <div class="d">Plan a la fecha: ${n0(c.planKm)} km<br>Faltan ${n0(Math.max(0,c.kmPlanTotal-c.kmReal))} km</div></div>
 </div>`;

 // --- Check-in semanal ---
 const winF=(a,b)=>x=>x.date>=a&&x.date<=b;
 const dOff=n=>iso(D(c.t).getTime()-n*86400000);
 const sum=(arr,a,b)=>arr.filter(winF(a,b)).reduce((s,x)=>s+(x.usd||0),0);
 const corr=[...c.exps.filter(x=>CORRIENTE.includes(x.cat)),...c.fuels];
 const s1=sum(corr,dOff(6),c.t),s0=sum(corr,dOff(13),dOff(7));
 const d1=Math.min(7,c.dayN),d0=Math.max(0,Math.min(7,c.dayN-7));
 const p1=d1?s1/d1:0,p0=d0?s0/d0:0;
 h+=`<div class="sec-t">Check-in semanal</div><div class="card"><table>
  <tr><th>Semana</th><th class="n">Días</th><th class="n">Gasto</th><th class="n">Ingresos</th><th class="n">$/día neto</th></tr>
  <tr><td>Últimos 7 días</td><td class="n">${d1}</td><td class="n">${usd(s1)}</td><td class="n">${usd(sum(c.incs,dOff(6),c.t))}</td><td class="n"><b>$${n0(p1-(d1?sum(c.incs,dOff(6),c.t)/d1:0))}</b></td></tr>
  ${d0?`<tr><td>7 anteriores</td><td class="n">${d0}</td><td class="n">${usd(s0)}</td><td class="n">${usd(sum(c.incs,dOff(13),dOff(7)))}</td><td class="n">$${n0(p0)}</td></tr>`:''}
  <tr><td>Objetivo del plan</td><td></td><td></td><td></td><td class="n">$${n0(c.burnPlan)}</td></tr></table>
  <div class="note">${p1>c.burnPlan*1.15
   ?'<b>Arriba del plan esta semana.</b> Antes de recortar paseos mirá dónde está: si es dormir, la salida son más noches libres; si es nafta, son más km de los previstos, no despilfarro.'
   :p1<c.burnPlan*.85?'Por debajo del plan. Tenés margen para algo que valga la pena y no estaba presupuestado.'
   :'En línea con el plan. Sin cambios necesarios.'}</div></div>`;

 // --- Hitos ---
 if(c.gates.length){
  h+=`<div class="sec-t">Hitos críticos</div><div class="grid">`;
  c.gates.forEach(g=>{
   const pas=g.dias<0,cls=g.st==='ok'?'ok':(g.id==='villazon'?'bad':(pas?'':(g.dias<21?'warn':'')));
   h+=`<div class="card" style="margin:0">
    <div style="display:flex;gap:8px;align-items:flex-start"><b style="flex:1;font-size:14.5px">${esc(g.t)}</b>
    <span class="tag ${cls}">${g.st==='ok'?'resuelto':g.st==='trabajando'?'en curso':'abierto'}</span></div>
    <div class="muted" style="margin-top:3px">${fDate(g.date)} · ${pas?'ya pasó':'en '+g.dias+' días'}</div>
    <div class="hint">${esc(g.note)}</div>
    <div class="seg mt">${['abierto','trabajando','ok'].map(s=>`<button class="${g.st===s?'on':''}" onclick="setGate('${g.id}','${s}')" style="font-size:12px">${s==='ok'?'resuelto':s}</button>`).join('')}</div></div>`;});
  h+=`</div>`;}

 // --- Región ---
 h+=`<div class="sec-t">Desvío por región</div><div class="card"><table>
  <tr><th>Región</th><th class="n">Días</th><th class="n">Plan</th><th class="n">Real</th><th class="n">Δ</th></tr>
  ${REGION_ORDER.map(r=>{const x=c.byReg[r];if(!x.dias&&!x.real)return'';const d=x.real-x.plan;
   return `<tr><td><span style="color:${REGION_COLORS[r]}">●</span> ${r}</td><td class="n">${x.dias}</td>
   <td class="n">${usd(x.plan)}</td><td class="n">${usd(x.real)}</td><td class="n ${d>0?'pos':'neg'}">${x.real?sgn(d):'—'}</td></tr>`;}).join('')}
  </table><div class="hint">Solo gasto corriente. Los costos únicos se controlan uno por uno en Gastos.</div></div>`;

 $('#v-tablero').innerHTML=h;}
function setGate(id,s){REAL.gates[id]={status:s,ua:now()};saveReal();renderAll();}

function dayRec(d){if(!REAL.days[d])REAL.days[d]={date:d,odo:null,stopIdx:null,place:"",sleepType:"",sleepName:"",ua:now()};return REAL.days[d];}
function renderHoy(){
 const c=calc(),t=c.t,r=dayRec(t),P=c.P;
 const prev=(()=>{const d=lDays().filter(x=>x.odo&&x.date<t);return d.length?d[d.length-1].odo:c.odo0;})();
 const kmHoy=(r.odo&&prev)?(r.odo-prev)*KM_PER_MI:null;
 const stop=r.stopIdx!=null?P[r.stopIdx]:c.planHoy;
 const country=stop?stop.country:"Estados Unidos",cur=CUR_BY_COUNTRY[country]||"USD";
 const gh=[...c.exps.filter(e=>e.date===t),...c.fuels.filter(f=>f.date===t)];
 const tot=gh.reduce((a,x)=>a+(x.usd||0),0);
 const ih=c.incs.filter(x=>x.date===t).reduce((a,x)=>a+(x.usd||0),0);
 let h='';
 if(!c.started)h+=`<div class="banner i"><b>Faltan ${dDiff(t,c.B.start)} días para la salida.</b> Antes de arrancar: cargá el odómetro inicial en Ajustes y abrí esta página una vez con wifi.</div>`;

 h+=`<div class="grid">
  <div class="card"><h3>📍 Dónde estamos <span class="r">${esc(country)}</span></h3>
   <select onchange="setDayStop(this.value)"><option value="">— elegí la parada —</option>
   ${P.map(s=>`<option value="${s.i}" ${r.stopIdx==s.i?'selected':''}>${esc(s.n)}</option>`).join('')}</select>
   <div class="mt"><input placeholder="…o el lugar exacto (pueblo, camping, playa)" value="${esc(r.place)}" onchange="setDay('place',this.value)"></div>
   ${c.planHoy&&r.stopIdx!=null&&r.stopIdx!=c.planHoy.i?`<div class="note">El plan para hoy decía: <b>${esc(c.planHoy.n)}</b>.</div>`:''}</div>

  <div class="card"><h3>🚙 Odómetro <span class="r">${prev?'último: '+n0(prev)+' mi':'sin registro'}</span></h3>
   <div class="row"><div><label>Millas (tablero)</label>
   <input type="number" inputmode="numeric" value="${r.odo||''}" onchange="setDay('odo',parseFloat(this.value)||null)" placeholder="${prev||''}"></div>
   <div><label>Km de hoy</label><div style="padding:9px 0;font-size:24px;font-weight:800;color:var(--blue)">${kmHoy!=null?n0(kmHoy):'—'}</div></div></div></div>
 </div>`;

 h+=`<div class="card"><h3>💸 Gastos de hoy <span class="r">${usd(tot)}${ih?' · ingresos '+usd(ih):''}</span></h3>
  <div class="chips">${Object.keys(CATS).map(k=>`<button class="chip" onclick="modExp('${k}')"><span class="e">${CATS[k].e}</span><span class="t">${CATS[k].t}</span></button>`).join('')}</div>
  <div class="btnrow mt"><button class="btn b sm" onclick="modInc()">＋ Ingreso</button>
   <button class="btn sm" onclick="modOneOff()">＋ Hito del plan <span class="tag warn" style="font-size:9.5px">${c.hitos.filter(o=>c.uniReal[o.name]==null).length}</span></button></div>
  ${gh.length?`<div class="mt">${gh.map(x=>{const f=x.qty!=null,k=f?'nafta':x.cat;
   return `<div class="li"><div class="ic">${CATS[k].e}</div>
   <div class="m"><b>${esc(f?((x.qty||0)+' '+(x.unit==='gal'?'gal':'L')+' de nafta'):(x.desc||CATS[k].t))}</b>
   <span>${n0(x.amt)} ${x.cur}${x.cur!=='USD'?' · TC '+n1(x.rate):''}</span></div>
   <div class="a">${usd(x.usd)}</div><button class="x" onclick="delRec('${f?'fuel':'exp'}','${x.id}')">✕</button></div>`;}).join('')}</div>`
   :'<div class="hint">Todavía no cargaste nada hoy.</div>'}
  ${!fxOk(cur)&&cur!=='USD'?`<div class="banner w mt">Estás en ${esc(country)} y el TC de ${cur} sigue siendo el estimado (${n1(fxRate(cur))}). <b>Confirmalo en Ajustes</b> o todos los gastos de este país van a estar mal.</div>`:''}</div>`;

 // Un solo bloque para el día. Antes había tres campos que decían lo mismo
 // (ánimo, bitácora y "momento") y una galería de fotos que no se sincronizaba
 // ni se podía publicar. La foto la saca el celular; acá va lo que el celular
 // no guarda: qué pasó, en una línea.
 const ST=["libre","camping","hostal","hotel","casa","otro"];
 h+=`<div class="card"><h3>🛏️ Dónde dormimos</h3>
  <div class="seg">${ST.map(s=>`<button class="${r.sleepType===s?'on':''}" onclick="setDay('sleepType','${s}')">${s}</button>`).join('')}</div>
  <div class="mt"><input placeholder="Nombre del lugar donde dormimos" value="${esc(r.sleepName)}" onchange="setDay('sleepName',this.value)"></div>
</div>`;

 $('#v-hoy').innerHTML=h;}
function setDay(f,v){const r=dayRec(today());r[f]=v;r.ua=now();saveReal();renderAll();}
function setDayStop(v){const r=dayRec(today());r.stopIdx=v===''?null:parseInt(v,10);r.ua=now();saveReal();renderAll();}

/* ---- Modal de gasto / ingreso ---- */
function curNow(){const r=REAL.days[today()],P=planEnriched();
 const s=(r&&r.stopIdx!=null)?P[r.stopIdx]:planStopFor(today());
 const c=s?s.country:"Estados Unidos";
 return{country:c,cur:CUR_BY_COUNTRY[c]||"USD",gal:GAL_COUNTRIES.includes(c)};}
let OO=null;   // costo único que se está cargando, si aplica
function modExp(cat,oo){
 OO=oo||null;
 const x=curNow(),f=cat==='nafta',cs=Object.keys(FX_SEED);
 openMod(`<h2>${CATS[cat].e} ${OO?'Costo único':CATS[cat].t}</h2>
  ${OO?`<div class="note" style="margin:0 0 12px">${esc(OO.oneOff)}<br>Estimado del plan: <b>${usd(OO.est)}</b></div>`:''}
  ${f?`<div class="row"><div><label>Cantidad</label><input id="fQty" type="number" step="0.01" inputmode="decimal" autofocus></div>
   <div><label>Unidad</label><select id="fUnit"><option value="gal" ${x.gal?'selected':''}>galones</option><option value="L" ${!x.gal?'selected':''}>litros</option></select></div></div>
   <div class="mt"><label>Odómetro al cargar (millas)</label><input id="fOdo" type="number" inputmode="numeric"></div>`
  :`<div><label>¿Qué fue?</label><input id="eDesc" value="${OO?esc(OO.oneOff.slice(0,60)):''}" placeholder="${CATS[cat].t.toLowerCase()}…" autofocus></div>`}
  <div class="row mt"><div><label>Monto</label><input id="eAmt" type="number" step="0.01" inputmode="decimal" oninput="modPrev()"></div>
  <div><label>Moneda</label><select id="eCur" onchange="modFx()">${cs.map(k=>`<option ${k===x.cur?'selected':''}>${k}</option>`).join('')}</select></div></div>
  <div class="row mt" id="fxRow"><div><label>Tipo de cambio (1 USD = ?)</label><input id="eRate" type="number" step="0.0001" inputmode="decimal" value="${fxRate(x.cur)}" oninput="modPrev()"></div>
  <div><label>En dólares</label><div id="ePrev" style="padding:9px 0;font-size:22px;font-weight:800;color:var(--blue)">$0</div></div></div>
  <div class="mt"><label>Fecha</label><input id="eDate" type="date" value="${today()}"></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  <button class="btn p" style="flex:1" onclick="saveExp('${cat}')">Guardar</button></div>
  <div class="hint">País: ${esc(x.country)}. El TC queda congelado en el gasto: si mañana cambia, lo viejo no se toca.</div>`);
 modFx();}
function modFx(){const c=$('#eCur').value;$('#eRate').value=fxRate(c);$('#fxRow').style.display=c==='USD'?'none':'flex';modPrev();}
function modPrev(){const a=parseFloat(($('#eAmt')||{}).value)||0,c=$('#eCur').value;
 const r=c==='USD'?1:(parseFloat($('#eRate').value)||1);const p=$('#ePrev');if(p)p.textContent=usd(a/r);}
function saveExp(cat){
 const amt=parseFloat($('#eAmt').value)||0;if(!amt){alert('Falta el monto.');return;}
 const cur=$('#eCur').value,rate=cur==='USD'?1:(parseFloat($('#eRate').value)||1);
 const date=$('#eDate').value||today(),x=curNow(),id=uid();
 const base={id,date,amt,cur,rate,usd:amt/rate,country:x.country,ua:now()};
 if(cat==='nafta'){
  const qty=parseFloat(($('#fQty')||{}).value)||0,unit=($('#fUnit')||{}).value||'L',odo=parseFloat(($('#fOdo')||{}).value)||null;
  REAL.fuel[id]={...base,qty,unit,odo};
  if(odo){const r=dayRec(date);if(!r.odo||odo>r.odo){r.odo=odo;r.ua=now();}}
 }else{
  REAL.exp[id]={...base,cat,desc:$('#eDesc').value||CATS[cat].t,oneOff:OO?OO.oneOff:undefined};
  if(OO)REAL.oneoff[OO.oneOff]={paid:true,expId:id,ua:now()};
 }
 OO=null;
 if(cur!=='USD'&&rate!==FX_SEED[cur])REAL.fx[cur]={r:rate,ok:true,ua:now()};
 saveReal();closeMod();renderAll();}
function delRec(k,id){if(!confirm('¿Borrar?'))return;
 const m=k==='fuel'?REAL.fuel:k==='inc'?REAL.inc:REAL.exp;
 if(m[id]){
  // Si el gasto estaba ligado a un costo único, el ítem del plan vuelve a
  // quedar pendiente. Si no, el checklist mentiría.
  if(m[id].oneOff&&REAL.oneoff[m[id].oneOff])REAL.oneoff[m[id].oneOff]={paid:false,ua:now()};
  m[id].del=true;m[id].ua=now();
 }
 saveReal();renderAll();}

/* Costos únicos: se cargan como un gasto real más, ligados al ítem del plan.
   Así aparecen en Movimientos, entran en el total gastado y el plan-vs-real
   sale solo. Antes eran un checklist paralelo que no tocaba ningún número. */
function togPartida(name){
 const o=(PLAN.budget.oneOff||[]).find(x=>x.name===name);if(!o)return;
 REAL.envel=REAL.envel||{};
 REAL.envel[name]={name,v:!esPartida(o),ua:now()};
 saveReal();renderGastos();}

function modOneOff(){
 const c=calc();
 const pend=c.hitos.filter(o=>c.uniReal[o.name]==null).sort((a,b)=>b.amount-a.amount);
 if(!pend.length){alert('Ya cargaste todos los hitos del plan. Los peajes y el mantenimiento se cargan con los botones normales de gasto.');return;}
 openMod(`<h2>Costo único del plan</h2>
  <div class="hint" style="margin:0 0 12px">Elegí el ítem y cargá lo que salió DE VERDAD. Se guarda como un gasto normal y el desvío contra el estimado se calcula solo.</div>
  <div><label>¿Cuál?</label><select id="ooSel" onchange="ooPick()">
   ${pend.map(o=>`<option value="${esc(o.name)}" data-amt="${o.amount}" data-cat="${esc(o.cat||'otros')}">${esc(o.name.slice(0,70))}${o.name.length>70?'…':''} — est. $${n0(o.amount)}</option>`).join('')}</select></div>
  <div class="note" id="ooEst"></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  <button class="btn p" style="flex:1" onclick="ooNext()">Cargar el gasto</button></div>`);
 ooPick();}
function ooPick(){
 const o=$('#ooSel').selectedOptions[0];
 $('#ooEst').innerHTML=`El plan estimaba <b>${usd(+o.dataset.amt)}</b> para este ítem.`;}
function ooNext(){
 const o=$('#ooSel').selectedOptions[0];
 const name=o.value, amt=+o.dataset.amt, cat=o.dataset.cat;
 // Mapeo de la categoría del presupuesto a la del gasto.
 const MAP={pasajes:'otros',tramites:'tramites',mantenimiento:'auto',peajes:'peajes',entretenimiento:'entretenimiento'};
 closeMod();
 modExp(MAP[cat]||'otros',{oneOff:name,est:amt});}

function modInc(){
 const x=curNow(),cs=Object.keys(FX_SEED);
 const src=Object.values(REAL.ideas).filter(i=>!i.del);
 openMod(`<h2>💵 Cargar un ingreso</h2>
  <div><label>¿De qué?</label><select id="iSrc">${src.map(s=>`<option value="${esc(s.t)}">${esc(s.t)}</option>`).join('')}<option value="otro">Otro</option></select></div>
  <div class="mt"><label>Detalle</label><input id="iDesc" placeholder="cliente, feria, venta…"></div>
  <div class="row mt"><div><label>Monto</label><input id="eAmt" type="number" step="0.01" inputmode="decimal" oninput="modPrev()"></div>
  <div><label>Moneda</label><select id="eCur" onchange="modFx()">${cs.map(k=>`<option ${k===x.cur?'selected':''}>${k}</option>`).join('')}</select></div></div>
  <div class="row mt" id="fxRow"><div><label>Tipo de cambio</label><input id="eRate" type="number" step="0.0001" value="${fxRate(x.cur)}" oninput="modPrev()"></div>
  <div><label>En dólares</label><div id="ePrev" style="padding:9px 0;font-size:22px;font-weight:800;color:var(--teal)">$0</div></div></div>
  <div class="mt"><label>Fecha</label><input id="eDate" type="date" value="${today()}"></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  <button class="btn p" style="flex:1" onclick="saveInc()">Guardar</button></div>`);
 modFx();}
function saveInc(){
 const amt=parseFloat($('#eAmt').value)||0;if(!amt){alert('Falta el monto.');return;}
 const cur=$('#eCur').value,rate=cur==='USD'?1:(parseFloat($('#eRate').value)||1);
 const id=uid(),x=curNow();
 REAL.inc[id]={id,date:$('#eDate').value||today(),src:$('#iSrc').value,desc:$('#iDesc').value||'',
  amt,cur,rate,usd:amt/rate,country:x.country,ua:now()};
 saveReal();closeMod();renderAll();}

/* --------------------------------------------------------------------------
   RUTA
   -------------------------------------------------------------------------- */
function renderRuta(){
 const c=calc(),P=c.P,days=lDays();
 let h=`<div id="map"></div><div class="sec-t">Bitácora — ${days.length} días registrados</div>`;
 if(!days.length)h+=`<div class="card"><div class="muted">Cada vez que completás algo en <b>Hoy</b>, aparece acá.</div></div>`;
 days.slice().reverse().forEach(d=>{
  const s=d.stopIdx!=null?P[d.stopIdx]:null;
  const g=[...c.exps.filter(e=>e.date===d.date),...c.fuels.filter(f=>f.date===d.date)].reduce((a,x)=>a+(x.usd||0),0);
  const n=c.B.start?dDiff(c.B.start,d.date)+1:0;
  h+=`<div class="card"><div style="display:flex;gap:9px;align-items:baseline">
   <b style="font-size:16px">Día ${n}</b><span class="muted">${fDate(d.date)}</span>
   <span style="margin-left:auto;font-weight:800">${usd(g)}</span></div>
   <div style="margin-top:3px;font-size:14.5px">${esc(d.place||(s?s.n:'—'))}</div>
   ${d.sleepType?`<div class="muted">🛏️ ${esc(d.sleepType)}${d.sleepName?' · '+esc(d.sleepName):''}</div>`:''}
</div>`;});
 $('#v-ruta').innerHTML=h;
 drawMap();}
function drawMap(){
 if(window.__noLeaflet||typeof L==='undefined'){$('#map').innerHTML='<div style="padding:24px;text-align:center;color:var(--tx2)">Sin conexión: el mapa necesita internet. La bitácora de abajo funciona igual.</div>';return;}
 const P=planEnriched();if(!P.length)return;
 if(MAP){MAP.remove();MAP=null;}
 MAP=L.map('map',{scrollWheelZoom:false}).setView([P[0].lat,P[0].lon],4);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18,attribution:'© OSM © CARTO'}).addTo(MAP);
 L.polyline(P.map(s=>[s.lat,s.lon]),{color:'#90a4ae',weight:2,dashArray:'5,7'}).addTo(MAP);
 const done=lDays().filter(d=>d.stopIdx!=null).map(d=>P[d.stopIdx]).filter(Boolean),u=[];
 done.forEach(s=>{if(!u.length||u[u.length-1].i!==s.i)u.push(s);});
 if(u.length>1)L.polyline(u.map(s=>[s.lat,s.lon]),{color:'#e65100',weight:4}).addTo(MAP);
 const V=new Set(u.map(s=>s.i));
 P.forEach(s=>{const v=V.has(s.i);
  L.circleMarker([s.lat,s.lon],{radius:v?6:4,color:v?'#e65100':REGION_COLORS[s.region],
   fillColor:v?'#e65100':'#fff',fillOpacity:1,weight:2})
   .bindPopup(`<b>${esc(s.n)}</b><br>${fDate(s.start)} · ${esc(s.country)}`).addTo(MAP);});
 if(u.length)MAP.setView([u[u.length-1].lat,u[u.length-1].lon],5);
 setTimeout(()=>MAP&&MAP.invalidateSize(),150);}

/* --------------------------------------------------------------------------
   GASTOS
   -------------------------------------------------------------------------- */
let finTab='mov';
function renderGastos(){
 const c=calc();
 let h=`<div class="seg" style="margin-bottom:14px">${[['mov','Movimientos'],['comp','Plan vs Real'],['uni','Hitos y partidas']]
  .map(([k,t])=>`<button class="${finTab===k?'on':''}" onclick="finTab='${k}';renderGastos()">${t}</button>`).join('')}</div>`;

 if(finTab==='mov'){
  h+=`<div class="kpis" style="margin-bottom:14px">
   <div class="kpi"><div class="l">Gastado</div><div class="v">${usd(c.realTotal)}</div><div class="d">de ${usd(c.planTotal)}</div></div>
   <div class="kpi te"><div class="l">Ingresos</div><div class="v">${usd(c.income)}</div><div class="d">${c.realTotal?n0(c.income/c.realTotal*100):0}% del gasto</div></div>
   <div class="kpi ok"><div class="l">Queda</div><div class="v">${usd(c.disponible)}</div><div class="d">${usd(c.uniPend)} comprometidos</div></div></div>`;
  const all=[...c.exps,...c.fuels.map(f=>({...f,cat:'nafta',desc:(f.qty||0)+' '+(f.unit==='gal'?'gal':'L')+' de nafta',_f:1})),
   ...c.incs.map(i=>({...i,cat:'ingreso',desc:(i.src||'')+(i.desc?' — '+i.desc:''),_i:1}))]
   .sort((a,b)=>b.date.localeCompare(a.date)||(b.ua||0)-(a.ua||0));
  if(!all.length)h+=`<div class="card"><div class="muted">Sin movimientos todavía.</div></div>`;
  let last='';
  all.forEach((x,ix)=>{
   if(x.date!==last){last=x.date;
    const t=all.filter(y=>y.date===x.date&&!y._i).reduce((a,y)=>a+(y.usd||0),0);
    h+=`<div class="sec-t">${fDate(x.date)} · ${usd(t)}</div><div class="card">`;}
   h+=`<div class="li"><div class="ic">${x._i?'💵':CATS[x.cat].e}</div>
    <div class="m"><b>${esc(x.desc)} ${x.oneOff?'<span class="tag pu" style="font-size:9.5px">costo único</span>':''}</b><span>${n0(x.amt)} ${x.cur}${x.cur!=='USD'?' · TC '+n1(x.rate):''} · ${esc(x.country||'')}</span></div>
    <div class="a" ${x._i?'style="color:var(--ok)"':''}>${x._i?'+':''}${usd(x.usd)}</div>
    <button class="x" onclick="delRec('${x._f?'fuel':x._i?'inc':'exp'}','${x.id}')">✕</button></div>`;
   const nx=all[ix+1];if(!nx||nx.date!==x.date)h+=`</div>`;});}

 if(finTab==='comp'){
  h+=`<div class="card"><h3>El número que importa</h3><table>
   <tr><td>Plan corriente a la fecha</td><td class="n">${usd(c.planCorr)}</td></tr>
   <tr><td>Real corriente a la fecha</td><td class="n">${usd(c.realCorr)}</td></tr>
   <tr style="font-weight:800"><td>Desvío</td><td class="n ${c.desvio>0?'pos':'neg'}">${sgn(c.desvio)} (${c.desvioPct>=0?'+':''}${n0(c.desvioPct)}%)</td></tr></table>
   <div class="note">Positivo = gastando de más. Es el único número sobre el que podés actuar mañana: los costos únicos ya están decididos.</div></div>`;
  h+=`<div class="card"><h3>Costos únicos a la fecha</h3><table>
   <tr><td>Estimado de lo ya pagado</td><td class="n">${usd(c.uniEst)}</td></tr>
   <tr><td>Salió realmente</td><td class="n">${usd(c.uniPag)}</td></tr>
   <tr style="font-weight:800"><td>Desvío</td><td class="n ${c.uniPag-c.uniEst>0?'pos':'neg'}">${c.uniEst?sgn(c.uniPag-c.uniEst):'—'}</td></tr>
   <tr><td>Pendientes de pagar</td><td class="n">${usd(c.uniPend)}</td></tr></table>
   <div class="hint">Se controlan ítem por ítem y no se prorratean: caen en fechas puntuales y repartirlos entre 131 días sería mentir.</div></div>`;
  const resto=c.realTotal-c.realCorr-c.uniPag;
  h+=`<div class="card" style="border-top:3px solid var(--purple)"><h3>Todo junto</h3><table>
   <tr><td>Gasto corriente (nafta, comida, dormir, otros)</td><td class="n">${usd(c.realCorr)}</td></tr>
   <tr><td>Hitos y partidas</td><td class="n">${usd(c.uniPag)}</td></tr>
   ${Math.abs(resto)>0.5?`<tr><td>Otros gastos sueltos</td><td class="n">${usd(resto)}</td></tr>`:''}
   <tr style="font-weight:700"><td>Total gastado</td><td class="n">${usd(c.realTotal)}</td></tr>
   <tr><td>Ingresos de ruta</td><td class="n neg">−${n0(c.income)}</td></tr>
   <tr style="font-weight:800"><td>Neto</td><td class="n">${usd(c.realTotal-c.income)}</td></tr>
   <tr><td>Presupuesto total del plan</td><td class="n">${usd(c.planTotal)}</td></tr></table>
   <div class="hint">"Otros sueltos" son gastos de categorías que no están atadas a ninguna partida ni a ningún hito. Si esa línea crece, conviene convertir ese ítem del plan en partida.</div></div>`;
  h+=`<div class="card"><h3>Por categoría</h3><table>
   <tr><th>Categoría</th><th class="n">Real</th><th class="n">%</th></tr>
   ${Object.keys(CATS).filter(k=>c.byCat[k]>0).sort((a,b)=>c.byCat[b]-c.byCat[a]).map(k=>
    `<tr><td>${CATS[k].e} ${CATS[k].t}</td><td class="n">${usd(c.byCat[k])}</td><td class="n">${c.realTotal?n0(c.byCat[k]/c.realTotal*100):0}%</td></tr>`).join('')}
   <tr style="font-weight:800"><td>TOTAL</td><td class="n">${usd(c.realTotal)}</td><td class="n">100%</td></tr></table></div>`;
  h+=`<div class="card"><h3>Presupuesto del plan (congelado)</h3><table>
   <tr><td>Día a día</td><td class="n">${usd(c.planDaily)}</td></tr>
   <tr><td>Nafta</td><td class="n">${usd(c.planFuel)}</td></tr>
   <tr><td>Costos únicos</td><td class="n">${usd(c.planOneOff)}</td></tr>
   <tr><td>Contingencia ${c.contPct}%</td><td class="n">${usd(c.planCont)}</td></tr>
   <tr style="font-weight:800"><td>TOTAL</td><td class="n">${usd(c.planTotal)}</td></tr></table></div>`;}

 if(finTab==='uni'){
  const d=c.uniPag-c.uniEst, pagados=c.hitos.filter(o=>c.uniReal[o.name]!=null).length;
  h+=`<div class="kpis" style="margin-bottom:14px">
   <div class="kpi ok"><div class="l">Ejecutado</div><div class="v">${usd(c.uniPag)}</div>
    <div class="d">${pagados} de ${c.hitos.length} hitos + lo consumido de las partidas</div></div>
   <div class="kpi warn"><div class="l">Falta</div><div class="v">${usd(c.uniPend)}</div>
    <div class="d">Hitos sin pagar + saldo de las partidas</div></div></div>`;

  // ---- PARTIDAS ----
  const pk=Object.keys(c.partidas);
  if(pk.length){
   h+=`<div class="sec-t">Partidas — bolsas que se van consumiendo</div>`;
   h+=`<div class="banner i">Estas no se tildan: se cargan como gastos normales desde <b>Hoy</b> (🔧 Auto para mantenimiento, 🛣️ Peajes) y la bolsa se descuenta sola. Un pinchazo en Perú y otro en Bolivia son dos movimientos, no uno.</div>`;
   pk.forEach(k=>{
    const p=c.partidas[k], pct=p.plan?Math.min(100,p.real/p.plan*100):0;
    const g=p.real>p.plan?'bad':pct>80?'warn':'ok';
    h+=`<div class="card"><h3>${esc(k.charAt(0).toUpperCase()+k.slice(1))}
      <span class="r">${p.movs} movimiento${p.movs===1?'':'s'}</span></h3>
     <div style="display:flex;align-items:baseline;gap:8px">
      <b style="font-size:26px;color:var(--${g==='ok'?'ok':g==='warn'?'warn':'bad'})">${usd(p.real)}</b>
      <span class="muted">de ${usd(p.plan)} presupuestados</span>
      <span style="margin-left:auto;font-weight:800;color:var(--${g==='ok'?'ok':g==='warn'?'warn':'bad'})">${n0(pct)}%</span></div>
     <div class="bar"><i style="width:${pct}%;background:var(--${g==='ok'?'ok':g==='warn'?'warn':'bad'})"></i></div>
     <div class="hint">${p.real>p.plan

     <div style="margin-top:10px">${p.items.map(o=>`<div class="li" style="padding:7px 0">
       <div class="m"><b style="white-space:normal;font-weight:600;font-size:13px">${esc(o.name)}</b></div>
       <div class="a" style="font-size:13px;color:var(--tx2)">${usd(o.amount)}</div>
       <button class="x" style="font-size:11px;font-weight:700" onclick="togPartida(${q(o.name)})" title="Pasar a hito">→ hito</button></div>`).join('')}</div>
     </div>`;});}

  // ---- HITOS ----
  h+=`<div class="sec-t">Hitos — pasan una sola vez</div>`;
  h+=`<div class="banner i">Se cargan desde <b>Hoy → Hito del plan</b>. Quedan como un gasto normal en Movimientos y el desvío contra el estimado se calcula solo.</div>`;
  if(c.uniEst>0)h+=`<div class="card"><h3>Lo pagado, contra lo estimado</h3><table>
   <tr><td>Estimado del plan</td><td class="n">${usd(c.uniEst)}</td></tr>

/* ---- helpers del modelo de rutinas ---- */
const lunesDe=d=>{const z=new Date(d);z.setHours(0,0,0,0);z.setDate(z.getDate()-((z.getDay()+6)%7));return z;};
const semanaIdx=d=>Math.round((lunesDe(d)-ANCLA)/(7*86400000));
// Dueño de una tarea hoy: las fijas tienen dueño, las rotativas alternan por
// semana con un offset (así cocinar y lavar los platos nunca caen en el mismo).
function duenioDe(t,fecha){
 if(t.tipo==='fija')return t.d;
 if(t.tipo==='rotativa')return (semanaIdx(D(fecha))+(t.off||0))%2===0?'martin':'lula';
 return null;}
// hlog está keyed por "fecha|quien" en vez de por fecha: así Martín y Lula
// pueden marcar el mismo día desde dos teléfonos sin pisarse al sincronizar.
const hk=(f,q)=>f+'|'+q;
const hSet=(f,q)=>new Set(((REAL.hlog[hk(f,q)]||{}).ids)||[]);
const hHecho=(f,q,id)=>hSet(f,q).has(id);
function togHab(f,q,id){
 const s=hSet(f,q);s.has(id)?s.delete(id):s.add(id);
 REAL.hlog[hk(f,q)]={f,q,ids:[...s],ua:now()};
 saveReal();renderRutinas();}
const lTareas=()=>Object.values(REAL.tareas).filter(t=>!t.del);
const lHab=()=>Object.values(REAL.habitos).filter(h=>!h.del);
const lTlog=()=>Object.values(REAL.tlog).filter(r=>r&&!r.del);
function rachaHab(id,q,hoyStr){
 let n=0,d=D(hoyStr).getTime();
 if(!hHecho(iso(d),q,id))d-=86400000;
 while(hHecho(iso(d),q,id)){n++;d-=86400000;}
 return n;}
// Estado de cada tarea: hace cuánto se hizo, si está pendiente, si está vencida.
function estadoTareas(hoyStr){
 const ult={},hoyPor={};
 lTlog().forEach(r=>{if(!ult[r.tid]||r.d>ult[r.tid].d)ult[r.tid]=r;
  if(r.d===hoyStr)(hoyPor[r.tid]=hoyPor[r.tid]||[]).push(r.by);});
 const out={};
 lTareas().forEach(x=>{const u=ult[x.id],dias=u?dDiff(u.d,hoyStr):null;
  out[x.id]={dias,ultimaPor:u&&u.by,pendiente:dias===null||dias>=x.cada,
   frescura:dias===null?0:Math.max(0,1-dias/x.cada),hechaHoy:!!hoyPor[x.id],
   // "sin registro" no es lo mismo que "vencida": el día 1 todo está sin
   // registro y pintar 25 tareas en rojo hace que no se mire ninguna.
   vencida:dias!==null&&dias>=x.cada*2};});
 return out;}
function puntosDesde(desde,hasta){
 const acc={martin:0,lula:0};
 Object.values(REAL.hlog).forEach(l=>{
  if(!l||!l.f||l.f<desde||l.f>hasta)return;
  const nn=(l.ids||[]).length;
  if(l.q==='juntos'){acc.martin+=nn/2;acc.lula+=nn/2;}
  else if(acc[l.q]!==undefined)acc[l.q]+=nn;});
 lTlog().forEach(r=>{if(r.d>=desde&&r.d<=hasta&&acc[r.by]!==undefined)acc[r.by]+=r.pts||1;});
 return {martin:Math.round(acc.martin),lula:Math.round(acc.lula)};}
function hacerTarea(tid){
 if(!YO){alert('Primero decí quién sos, arriba.');return;}
 const t=REAL.tareas[tid],hoyStr=today();
 const ya=lTlog().find(r=>r.tid===tid&&r.d===hoyStr&&r.by===YO);
 if(ya){REAL.tlog[ya.id]={...ya,del:true,ua:now()};}
 else{const id=uid();REAL.tlog[id]={id,tid,d:hoyStr,by:YO,pts:t.pts,ua:now()};}
 saveReal();renderRutinas();}
function cambiarDuenio(tid){
 const t=REAL.tareas[tid];if(!t||t.tipo!=='fija')return;
 t.d=t.d==='martin'?'lula':'martin';t.ua=now();saveReal();renderRutinas();}

function vistaMes(hoyStr){
 if(!mesRef){const d=D(hoyStr);mesRef={y:d.getFullYear(),m:d.getMonth()};}
 if(!mesVista)mesVista=YO;
 const dias=new Date(mesRef.y,mesRef.m+1,0).getDate();
 const fechas=Array.from({length:dias},(_,i)=>{const d=new Date(mesRef.y,mesRef.m,i+1);
  return{f:iso(d),n:i+1,lun:((d.getDay()+6)%7)===0};});
 const lista=lHab().filter(x=>x.q===mesVista||x.q==='ambos'||x.q==='juntos');
 const qDe=x=>x.q==='juntos'?'juntos':mesVista;
 const on=(x,f)=>hHecho(f,qDe(x),x.id);
 // Solo cuentan los días desde que arrancó el viaje: contar como incumplidos
 // los días en que la app todavía no existía da un porcentaje falso y desmoraliza.
 const arranque=(tripBounds().start)||'0000-01-01';
 const pasados=fechas.filter(x=>x.f<=hoyStr&&x.f>=arranque);
 const objetivo=lista.length*pasados.length;
 const cumplidos=pasados.reduce((a,x)=>a+lista.filter(y=>on(y,x.f)).length,0);
 const pct=objetivo?Math.round(cumplidos/objetivo*100):0;
 const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
 let h=`<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <button class="btn sm" onclick="moverMes(-1)">‹</button>
  <b style="flex:1;text-align:center;font-size:16px">${MESES[mesRef.m]} ${mesRef.y}</b>
  <button class="btn sm" onclick="moverMes(1)">›</button>
  <div class="seg" style="width:100%">${Object.keys(PERSONAS).map(k=>`<button class="${mesVista===k?'on':''}" onclick="mesVista='${k}';renderRutinas()">${PERSONAS[k].nombre}</button>`).join('')}</div></div>`;
 h+=`<div class="kpis" style="margin-bottom:14px">
  <div class="kpi"><div class="l">Progreso del mes</div><div class="v">${pct}<small>%</small></div>
   <div class="d">${cumplidos} de ${objetivo} marcas posibles</div></div>
  <div class="kpi pu"><div class="l">Días de viaje este mes</div><div class="v">${pasados.length}</div>
   <div class="d">${arranque>iso(new Date(mesRef.y,mesRef.m,1))?'desde la salida ('+fDate(arranque)+')':'de '+dias+' del mes'}</div></div></div>`;
 const editable=mesVista===YO;
 h+=`<div class="card"><h3>Seguimiento <span class="r">${editable?'tocá cualquier día pasado':'solo lectura'}</span></h3>
  <div style="overflow-x:auto"><div class="grilla" style="--cols:${dias}">
  <div class="g-esq"></div>${fechas.map(x=>`<div class="g-dia ${x.f===hoyStr?'hoy':''}">${x.n}</div>`).join('')}
  ${lista.map(x=>`<div class="g-nom">${x.e} ${esc(x.n)}</div>`+
    fechas.map(f=>`<div class="celda ${on(x,f.f)?'on':''} ${f.f>hoyStr?'futuro':''}" ${(f.f>hoyStr||!editable)?'':`onclick="togHab('${f.f}','${qDe(x)}','${x.id}')"`}></div>`).join('')).join('')}
  </div></div></div>`;
 h+=`<div class="card"><h3>Cumplimiento por hábito <span class="r">${pasados.length} días</span></h3>
  ${lista.map(x=>({x,c:pasados.filter(f=>on(x,f.f)).length})).sort((a,b)=>b.c-a.c).map(({x,c})=>{
   const p=pasados.length?Math.round(c/pasados.length*100):0;
   return `<div class="li"><div class="ic">${x.e}</div>
    <div class="m"><b>${esc(x.n)}</b><span>🔥 ${rachaHab(x.id,qDe(x),hoyStr)} de racha</span>
     <div class="bar" style="margin:5px 0 0"><i style="width:${p}%;background:${p>=80?'var(--ok)':p>=50?'var(--blue)':'var(--warn)'}"></i></div></div>
    <div class="a">${p}%<span>${c}/${pasados.length}</span></div></div>`;}).join('')}</div>`;
 return h;}
function moverMes(n){const d=new Date(mesRef.y,mesRef.m+n,1);mesRef={y:d.getFullYear(),m:d.getMonth()};renderRutinas();}

function vistaReparto(hoyStr,pts,ET){
 const serie=Array.from({length:14},(_,i)=>{
  const d=iso(D(hoyStr).getTime()-(13-i)*86400000);
  const p=puntosDesde(d,d);return{d,m:p.martin,l:p.lula};});
 const max=Math.max(6,...serie.map(s=>Math.max(s.m,s.l)));
 const desde=iso(D(hoyStr).getTime()-29*86400000);
 const mes=puntosDesde(desde,hoyStr),tm=mes.martin+mes.lula;
 const pend=lTareas().filter(t=>ET[t.id].pendiente).sort((a,b)=>(ET[b.id].dias||999)-(ET[a.id].dias||999));
 let h=`<div class="card"><h3>Puntos por día <span class="r">últimos 14 días</span></h3>
  <div style="display:flex;align-items:flex-end;gap:5px;height:120px;padding:8px 0">
  ${serie.map(s=>`<div style="flex:1;display:flex;align-items:flex-end;gap:2px;height:100%" title="${s.d}">
   <span style="flex:1;background:${PERSONAS.martin.color};border-radius:2px 2px 0 0;height:${s.m/max*100}%;min-height:2px"></span>
   <span style="flex:1;background:${PERSONAS.lula.color};border-radius:2px 2px 0 0;height:${s.l/max*100}%;min-height:2px"></span></div>`).join('')}</div>
  <div class="hint">■ <b style="color:${PERSONAS.martin.color}">Martín ${pts.martin}</b> esta semana · ■ <b style="color:${PERSONAS.lula.color}">Lula ${pts.lula}</b></div></div>`;
 h+=`<div class="card"><h3>Reparto de los últimos 30 días</h3>
  ${['martin','lula'].map(p=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
   <span style="width:62px;color:${PERSONAS[p].color};font-weight:700">${PERSONAS[p].nombre}</span>
   <div class="bar" style="flex:1;margin:0"><i style="width:${tm?mes[p]/tm*100:50}%;background:${PERSONAS[p].color}"></i></div>
   <b style="width:38px;text-align:right">${mes[p]}</b></div>`).join('')}
  <div class="note">${tm&&Math.abs(mes.martin-mes.lula)/tm>0.25
   ? `El reparto está desbalanceado: <b>${mes.martin>mes.lula?'Martín':'Lula'}</b> viene haciendo bastante más. Vale la pena mirar qué tareas fijas conviene dar vuelta antes de que se convierta en un tema.`
   : 'El reparto está parejo. Nada que ajustar.'}</div></div>`;
 h+=`<div class="card"><h3>Deuda pendiente <span class="r">${pend.length}</span></h3>
  ${pend.slice(0,10).map(t=>`<div class="li"><div class="ic">${t.e}</div>
   <div class="m"><b>${esc(t.n)}</b><span>${ET[t.id].dias===null?'sin registro':'hace '+ET[t.id].dias+' días'} · cada ${t.cada} d</span></div>
   <span class="tag ${ET[t.id].vencida?'bad':'warn'}">${ET[t.id].vencida?'vencida':'toca'}</span></div>`).join('')}</div>`;
 return h;}

function chkWeek(){return iso(lunesDe(D(today())));}
function chkGet(){return new Set(((REAL.chk[chkWeek()]||{}).ids)||[]);}
function chkTog(id){
 const s=chkGet();s.has(id)?s.delete(id):s.add(id);
 REAL.chk[chkWeek()]={w:chkWeek(),ids:[...s],ua:now()};
 saveReal();renderCamioneta();}

  h+=`<div class="hint" style="padding:0 4px 10px">Se reinicia solo cada lunes y queda el historial. Los ítems con <span class="tag warn">verificar</span> son datos que dependen de tu camioneta y que conviene confirmar una vez, antes de salir.</div>`;

  CHK_SECS.forEach(sec=>{

       ${i.v?' <span class="tag warn" style="font-size:9.5px;vertical-align:middle">verificar</span>':''}</b>
       <span style="white-space:normal;display:block;margin-top:3px;line-height:1.45">${esc(i.d)}</span></div></div>`;}).join('')}
    </div>`;});

  h+=`<div class="sec-t">Rangos en vivo — qué mirar en la app</div><div class="card">

   <div class="m"><b>${esc(m.t)}</b><span>${ult?'último a las '+n0(ult.odo)+' mi':'sin registro — se cuenta desde la salida'} · cada ${n0(m.cada)} mi</span>
   <div class="bar" style="margin:5px 0 0"><i style="width:${pct}%;background:var(--${g==='ok'?'ok':g==='warn'?'warn':'bad'})"></i></div></div>
   <div class="a" style="color:var(--${g==='ok'?'ok':g==='warn'?'warn':'bad'})">${falta<0?'VENCIDO':n0(falta)}<span>${falta<0?n0(-falta)+' mi de más':'millas'}</span></div>
   <button class="x" onclick="modMant('${m.id}')">＋</button></div>`;});
 h+=`</div>`;

 h+=`<div class="sec-t">Historial de mantenimiento</div><div class="card">
  ${hist.length?hist.map(m=>{const d=MANT_SEED.find(x=>x.id===m.tipo)||{t:m.tipo,e:'🔧'};
   return `<div class="li"><div class="ic">${d.e}</div>
   <div class="m"><b>${esc(d.t)}</b><span>${fDate(m.date)} · ${n0(m.odo)} mi${m.lugar?' · '+esc(m.lugar):''}${m.note?' — '+esc(m.note):''}</span></div>
   <div class="a">${m.cost?usd(m.cost):'—'}</div>
   <button class="x" onclick="delMant('${m.id}')">✕</button></div>`;}).join('')
   :'<div class="muted">Sin registros todavía.</div>'}</div>`;

 h+=`<div class="sec-t">Incidentes</div><div class="card">
  <div class="btnrow" style="margin-bottom:10px"><button class="btn sm" onclick="modInc2()">＋ Registrar un incidente</button></div>
  ${inc.length?inc.map(i=>`<div class="li">
   <button class="x" style="font-size:18px;color:${i.solved?'var(--ok)':'var(--bad)'}" onclick="togInc2('${i.id}')">${i.solved?'☑':'⚠'}</button>
   <div class="m"><b style="${i.solved?'opacity:.6':''}">${esc(i.what)}</b><span>${fDate(i.date)} · ${n0(i.odo)} mi${i.note?' — '+esc(i.note):''}</span></div>
   <div class="a">${i.cost?usd(i.cost):'—'}</div><button class="x" onclick="delInc2('${i.id}')">✕</button></div>`).join('')
   :'<div class="muted">Ningún incidente. Ojalá siga así.</div>'}
  <div class="hint">Anotá también los sustos que no costaron plata: un ruido raro en Guatemala es la pista del problema que aparece en Perú.</div></div>`;
 $('#v-camioneta').innerHTML=h;}
function modMant(tipo){
 const c=calc(),d=MANT_SEED.find(x=>x.id===tipo)||{t:tipo};
 openMod(`<h2>🔧 ${esc(d.t)}</h2>
  <div class="row"><div><label>Fecha</label><input id="mD" type="date" value="${today()}"></div>
   <div><label>Odómetro (mi)</label><input id="mO" type="number" value="${c.odoNow||''}"></div></div>
  <div class="row mt"><div><label>Costo USD</label><input id="mC" type="number" step="0.01"></div>
   <div><label>Dónde</label><input id="mL" placeholder="taller, ciudad"></div></div>
  <div class="mt"><label>Notas</label><input id="mN"></div>
  <div class="btnrow mt" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeMod()">Cancelar</button>
  <button class="btn p" style="flex:1" onclick="saveMant('${tipo}')">Guardar</button></div>`);}
function saveMant(tipo){const id=uid();
 REAL.mant[id]={id,tipo,date:$('#mD').value||today(),odo:+$('#mO').value||0,cost:+$('#mC').value||0,
  lugar:$('#mL').value,note:$('#mN').value,ua:now()};
